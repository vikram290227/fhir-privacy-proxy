tenants:
  - issuer_url: "http://localhost:8180/realms/hospital-a"
    tenant_id: "hospital-a"
    # Use docker service name so the proxy container can reach Keycloak.
    # Keycloak's KC_HOSTNAME_URL ensures iss claim stays "localhost:8180".
    jwks_endpoint: "http://keycloak:8180/realms/hospital-a/protocol/openid-connect/certs"
    audience: "fhir-privacy-proxy"
    policy_bundle: "hospital-a"
    allowed_scopes:
      - "patient/Patient.read"
      - "patient/Observation.read"
      - "patient/Condition.read"
    # Per-tenant sensitive patient list. Consumed by OPA via
    # data.hospital_a.sensitive_patients (see policies/data.json).
    sensitive_patients:
      - "123"
      - "999"
    # Rate limits (per tenant_id + subject_id, sliding window) — these
    # are the backstop for bulk-extraction abuse when the ML risk
    # scoring layer alone isn't enough. Enforced only when REDIS_ADDR
    # is set. Zero / unset → fall back to package defaults (60 / 1000).
    requests_per_minute: 60
    requests_per_hour: 1000

  - issuer_url: "http://localhost:8180/realms/hospital-b"
    tenant_id: "hospital-b"
    jwks_endpoint: "http://keycloak:8180/realms/hospital-b/protocol/openid-connect/certs"
    audience: "fhir-privacy-proxy-b"
    policy_bundle: "hospital-b"
    allowed_scopes:
      - "patient/Patient.read"
      - "patient/Observation.read"
    # Hospital-B has a disjoint sensitive list. A token for hospital-a
    # must never be able to observe or act on these IDs, and vice versa —
    # this is verified by cmd/proxy/tenant_isolation_test.go.
    sensitive_patients:
      - "555"
      - "777"
    # Hospital-B runs a tighter hour budget to demonstrate per-tenant
    # tuning — this can be lifted by editing the file and reloading.
    requests_per_minute: 60
    requests_per_hour: 800

  # ─── NHS CIS2 sandbox tenant ──────────────────────────────────────────
  # Proves the existing JWKS/RS256 validation layer works against CIS2's
  # OpenAM endpoints without code changes — only a config entry changes.
  # Claims extraction uses cis2_mapper.go (nhsid_nrbac_roles → FHIRContext)
  # instead of the default Keycloak mapper.
  #
  # To use: register at https://digital.nhs.uk/developer/getting-started,
  # replace REPLACE_WITH_YOUR_CLIENT_ID with your sandbox client_id, then
  # set FHIR_UPSTREAM to the NHS sandbox FHIR R4 base URL.
  #
  # Note: developer.nhs.uk was decommissioned 2026-03-02. Use the current
  # NHS API Platform portal for all new registrations.
  - issuer_url: "https://am.nhsint.auth-ptl.cis2.spineservices.nhs.uk:443/openam/oauth2/realms/root/realms/NHSIdentity/realms/Healthcare"
    tenant_id: "nhs-cis2-sandbox"
    jwks_endpoint: "https://am.nhsint.auth-ptl.cis2.spineservices.nhs.uk:443/openam/oauth2/realms/root/realms/NHSIdentity/realms/Healthcare/connect/jwk_uri"
    audience: "REPLACE_WITH_YOUR_CLIENT_ID"
    identity_provider: "cis2"
    region: "national"
    policy_bundle: "nhs-cis2-sandbox"
    allowed_scopes:
      - "patient/Patient.read"
      - "patient/Observation.read"
      - "patient/Condition.read"
      - "patient/MedicationRequest.read"
    requests_per_minute: 30
    requests_per_hour: 300
