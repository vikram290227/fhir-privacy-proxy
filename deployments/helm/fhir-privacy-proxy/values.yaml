replicaCount: 2

image:
  repository: ghcr.io/vikram290227/fhir-privacy-proxy
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: fhir-proxy.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics

env:
  OPA_URL: "http://opa:8181"
  FHIR_UPSTREAM: "http://fhir-server/fhir"
  REDIS_ADDR: ""
  RISK_SERVICE_URL: ""

secrets:
  AZURE_STORAGE_ACCOUNT: ""
  AZURE_STORAGE_KEY: ""
