version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
    ports:
      - "8180:8180"
    command: start-dev
    volumes:
      - ./deployments/keycloak:/opt/keycloak/data/import

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  proxy:
    build: .
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis:6379
      - LOG_LEVEL=debug
    depends_on:
      - keycloak
      - redis
    volumes:
      - ./configs:/app/configs
      - ./policies:/app/policies

volumes:
  redis-data: