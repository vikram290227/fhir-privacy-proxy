version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Force issuer claim to use localhost so tokens obtained from the host
      # match the issuer_url in tenants.yaml.
      KC_HOSTNAME_URL: http://localhost:8180
    ports:
      - "8180:8180"
    # --import-realm picks up EVERY *.json file mounted under the import
    # directory, which is how we get BOTH realms (hospital-a via
    # realm-export.json AND hospital-b via realm-export-b.json) loaded at
    # startup. Each realm is fully isolated: separate JWKS, separate users
    # (nurse1/doctor1/admin1 vs. nurse-b1/doctor-b1/admin-b1), separate
    # audiences, and therefore distinct signed tokens.
    command: ["start-dev", "--http-port=8180", "--import-realm"]
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro

  opa:
    image: openpolicyagent/opa:latest-rootless
    ports:
      - "8181:8181"
    command: ["run", "--server", "--log-level=info", "/policies"]
    volumes:
      - ../../policies:/policies:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]

  fhir:
    image: hapiproject/hapi:latest
    ports:
      - "8090:8080"

  risk:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.risk
    ports:
      - "8000:8000"

  # Jaeger all-in-one: receives OTLP/HTTP from the proxy on :4318 and
  # serves the UI on :16686. Using the all-in-one image keeps this a
  # single-container dependency — fine for local dev and for the
  # "show the diagram works" story, but swap in a dedicated collector
  # + storage backend for anything production-bound.
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # web UI
      - "4318:4318"     # OTLP/HTTP receiver (spans from the proxy)

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      # Unauthenticated local-dev Grafana. DO NOT COPY to prod.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro

  proxy:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - keycloak
      - opa
      - fhir
      - redis
      - risk
      - jaeger
    env_file:
      - ../../.env
    environment:
      OPA_URL: http://opa:8181
      FHIR_UPSTREAM: http://fhir:8080/fhir
      RISK_SERVICE_URL: http://risk:8000
      AUDIT_LOG_FILE: /app/audit/audit.ndjson
      TENANTS_CONFIG: /app/configs/tenants.yaml
      REDIS_ADDR: redis:6379
      # OTLP/HTTP endpoint for Jaeger's all-in-one receiver. Leave
      # unset in environments without a collector — tracing.Init()
      # falls back to a no-op exporter so /health stays clean.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # Azure audit logging (leave unset when AUDIT_LOG_FILE is set)
      # AZURE_STORAGE_ACCOUNT: <your-storage-account>
      # AZURE_STORAGE_KEY: <your-storage-key>
      # AZURE_AUDIT_CONTAINER: fhir-audit-logs
    volumes:
      - ../../configs:/app/configs:ro
      - proxy-audit:/app/audit

volumes:
  proxy-audit: {}
