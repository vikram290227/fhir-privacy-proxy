version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8180"
    command: ["start-dev", "--http-port=8180"]

  opa:
    image: openpolicyagent/opa:latest-rootless
    ports:
      - "8181:8181"
    command: ["run", "--server", "--log-level=info", "/policies"]
    volumes:
      - ./policies:/policies:ro

  proxy:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - keycloak
      - opa
    volumes:
      - ./configs:/app/configs:ro