# Auto-provisioned Prometheus datasource. Grafana reads every file
# under /etc/grafana/provisioning/datasources/ at startup, so just
# dropping this alongside the dashboard JSON is enough to get a
# working data source wired without clicking through the UI.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
